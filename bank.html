<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bank connected</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #171717; --muted: #6b6b6b; --line: #e3e3e3; --brand: #3ecf8e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #ededed; --muted: #a0a0a0; --line: #2e2e2e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; font: 12px ui-monospace, monospace; padding: 10px;
             border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; word-break: break-all; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--brand); color: #0b0b0b; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1 id="h">Bank approved</h1>
  <p id="p">Copy this address and paste it to Claude. It only works once, within a few minutes.</p>
  <textarea id="u" readonly></textarea>
  <button id="b" type="button">Copy</button>
</main>
<script>
  const u = document.getElementById("u");
  u.value = location.href;
  const q = new URLSearchParams(location.search);
  if (q.get("error")) {
    document.getElementById("h").textContent = "Bank did not approve";
    document.getElementById("p").textContent = "Error: " + q.get("error") + ". Copy this and send it to Claude.";
  }
  document.getElementById("b").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); } catch { u.select(); document.execCommand("copy"); }
    document.getElementById("b").textContent = "Copied";
  };
</script>
</body>
</html>
