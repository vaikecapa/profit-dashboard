<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <script>
      // Bank approvals (Enable Banking) return here with ?code=&state= (or ?error=): show them on bank.html.
      (function () { var q = new URLSearchParams(location.search);
        if ((q.has("code") && q.has("state")) || (q.has("error") && q.has("state"))) location.replace("bank.html" + location.search); })();
      // Appearance chosen in Settings (auto | light | dark), applied before first paint.
      try {
        var a = localStorage.getItem("appearance");
        if (a === "light" || a === "dark") {
          document.documentElement.dataset.theme = a;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = a === "light" ? "#f2f2f7" : "#121212"; });
        }
      } catch (e) {}
    </script>
